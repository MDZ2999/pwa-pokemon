<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">

    <link rel="apple-touch-icon" sizes="72x72" href="./img/icons/icon-72x72.png">
    <link rel="apple-touch-icon" sizes="96x96" href="./img/icons/icon-96x96.png">
    <link rel="apple-touch-icon" sizes="128x128" href="./img/icons/icon-128x128.png">
    <link rel="apple-touch-icon" sizes="144x144" href="./img/icons/icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="./img/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="192x192" href="./img/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="384x384" href="./img/icons/icon-384x384.png">
    <link rel="apple-touch-icon" sizes="512x512" href="./img/icons/icon-512x512.png">
    <meta name="apple-mobile-web-app-status-bar" content="#dc3545">
    <meta name="theme-color" content="#dc3545">
    <title>Pokédex | PokéPWA</title>
</head>
<body>
    <main>
        <header class="site-header">
            <p class="eyebrow">Explora el mundo Pokémon</p>
            <h1>Pokédex</h1>
            <p class="intro">Descubre Pokémon y consulta sus datos y habilidades.</p>
            <button class="btn install-button" id="install-button" type="button" hidden>Instalar aplicación</button>
            <p class="install-status" id="install-status" role="status" aria-live="polite"></p>
        </header>
        <section class="container" aria-label="Catálogo de Pokémon">
            <p class="status-message" id="pokemon-status" role="status" aria-live="polite">Cargando Pokémon...</p>
            <div class="pokemon-grid" id="pokemon-list"></div>
            <button class="btn load-more" id="load-more" type="button" hidden>Cargar más Pokémon</button>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
